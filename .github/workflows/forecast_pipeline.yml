name: Weekly Agmarknet Forecast Pipeline

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install joblib numpy pandas scikit-learn pytest httpx2

      - name: Verify pipeline input
        shell: bash
        run: |
          test -f data/processed/agmarknet/onion_tamilnadu_weekly_2026.csv || \
            { echo "Missing processed market data. Add or download the input CSV before running CI."; exit 1; }
          test -f models/agmarknet/onion_price_adaptive_v1.joblib || \
            { echo "Missing adaptive forecaster model artifact."; exit 1; }

      - name: Regenerate features
        run: python -m scripts.feature_engineering

      - name: Generate predictions and telemetry
        run: python -m scripts.predict_adaptive_forecaster data/processed/agmarknet/features/onion_tamilnadu_forecasting_features.csv

      - name: Run integration tests
        run: python -m pytest backend/tests/test_forecasts.py

      - name: Upload forecast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agmarknet-forecast-results
          path: data/processed/agmarknet/model_results/
          if-no-files-found: warn
